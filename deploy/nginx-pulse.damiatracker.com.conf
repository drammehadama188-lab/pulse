# Damia Pulse — pulse.damiatracker.com (proxied to the Node service on :4010).
# Put in /etc/nginx/sites-available/, symlink into sites-enabled, test, reload.
# Then run: certbot --nginx -d pulse.damiatracker.com  (adds the 443 block + cert).
server {
    server_name pulse.damiatracker.com;

    # generous body size for document uploads (CVs, contracts)
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 80;
}
